server:
  port: 9060

spring:
  application:
    name: product-service
  profiles:
    active: prod
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
  jackson:
    mapper:
      ACCEPT_CASE_INSENSITIVE_ENUMS: 'true'

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9000/eureka/

jwt:
  secret: qwertyuiopasdfghjklzxcvbnmQWERTYUASDFGHJZXCVBNwerty
  expiry: 900000

gemini:
  api:
    key: AQ.Ab8RN6IewSE0z-l4Td1UhlhRXaeBtiIgbAa7yxpfTt0f3gn9Ag    # set this env variable — never hardcode
  embedding:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent

search:
  top-k: 10   # number of nearest neighbours to return from pgvector

springdoc:
  swagger-ui:
    enabled: true
  version: 2.6.7
  api-docs:
    enabled: true
  show-login-endpoint: false